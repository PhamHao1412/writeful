version: '3.8'

services:
  # Gateway Service (KrakenD API Gateway)
  # Cloudflare Tunnel - Cầu nối an toàn ra Internet
  # Main tunnel for HTTP API Gateway
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    # command: tunnel --no-autoupdate run --token eyJhIjoiZGI0ZWZiNzFiNTkxZGU1Mjg1ZjkwODc3MWU2ODkzYTMiLCJ0IjoiNTFkODQ2NjgtMDI2Mi00ZDg4LWE0MmEtMTJiNDA3NzYyYTExIiwicyI6Ik5qQTBOalUxWldFdE9EZGpNQzAwTUdSbExXRTVNRGN0TVRaa05EUm1NRE01TWpabSJ9
    command: tunnel --url http://gateway-service:8080
    networks:
      - writeful-network
    restart: unless-stopped
    depends_on:
      - gateway-service

  # Cloudflare Tunnel for WebSocket (Chat Service)
  # Separate tunnel needed because KrakenD doesn't support WebSocket proxying
  cloudflared-ws:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-ws
    command: tunnel --url http://chat-service:8006
    networks:
      - writeful-network
    restart: unless-stopped
    depends_on:
      - chat-service
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    image: haopham1709/gateway-service:latest
    container_name: gateway-service
    ports:
      - "8080:8080"
    volumes:
      - ./gateway-service/jwk:/jwk
    networks:
      - writeful-network
    restart: unless-stopped
    depends_on:
      - auth-service
      - content-service
      - media-service
      - chat-service

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: haopham1709/auth-service:latest
    container_name: auth-service
    environment:
      APP_NAME: auth-service
      APP_PORT: 8004
      APP_ENV: development
      APP_DB_SCHEMA_NAME: auth_service
      APP_DB_URL: "postgres://postgres:hacker1412@host.docker.internal:5438/playground?sslmode=disable&search_path=auth_service"
      JWT_SECRET: your-secret-key-change-this-in-production
      JWT_ACCESS_TOKEN_EXPIRY: 15m
      JWT_REFRESH_TOKEN_EXPIRY: 7d
    ports:
      - "8004:8004"
    networks:
      - writeful-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Content Service
  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    image: haopham1709/content-service:latest
    container_name: content-service
    environment:
      APP_NAME: content-service
      APP_PORT: 8003
      APP_ENV: development
      APP_DB_SCHEMA_NAME: content_service
      APP_DB_URL: "postgres://postgres:hacker1412@host.docker.internal:5438/playground?sslmode=disable&search_path=content_service"
      JWT_SECRET: your-secret-key-change-this-in-production
    ports:
      - "8003:8003"
    networks:
      - writeful-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Media Service
  media-service:
    image: haopham1709/media-service:latest
    container_name: media-service
    environment:
      APP_NAME: media-service
      APP_PORT: 8005
      APP_ENV: development
      APP_DB_SCHEMA_NAME: media_service
      APP_DB_URL: "postgres://postgres:hacker1412@host.docker.internal:5438/playground?sslmode=disable&search_path=media_service"
      JWT_SECRET: your-secret-key-change-this-in-production
    ports:
      - "8005:8005"
    networks:
      - writeful-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Chat Service
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    image: haopham1709/chat-service:latest
    container_name: chat-service
    environment:
      APP_NAME: chat-service
      APP_PORT: 8006
      APP_ENV: development
      APP_DB_SCHEMA_NAME: chat_service
      APP_DB_URL: "postgres://postgres:hacker1412@host.docker.internal:5438/playground?sslmode=disable&search_path=chat_service"
      JWT_SECRET: your-secret-key-change-this-in-production
      JWT_ACCESS_TOKEN_EXPIRY: 15m
      JWT_REFRESH_TOKEN_EXPIRY: 7d
      AUTH_SERVICE_URL: http://auth-service:8004
    ports:
      - "8006:8006"
    networks:
      - writeful-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  writeful-network:
    driver: bridge
